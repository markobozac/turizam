name: Deploy to markobozac.com/turizam

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check deploy secrets
        id: secrets
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if [ -z "$FTP_SERVER" ] || [ -z "$FTP_USERNAME" ] || [ -z "$FTP_PASSWORD" ]; then
            echo "::warning::FTP_SERVER, FTP_USERNAME or FTP_PASSWORD secret is missing - skipping deploy. See README."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache-bust asset URLs
        if: steps.secrets.outputs.ok == 'true'
        run: |
          v=${GITHUB_SHA::7}
          sed -i -E "s#(href|src)=\"(app\.css|app\.js|data\.js)\"#\1=\"\2?v=$v\"#g" site/index.html
          grep -o '?v=[a-f0-9]*' site/index.html | sort -u

      - name: Upload via FTPS
        if: steps.secrets.outputs.ok == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ./
